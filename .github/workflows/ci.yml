name: CI

# The gate. Everything that can fail cheaply fails here, before a tag is cut or
# anything reaches Hosting.
#
# It is also a reusable workflow: release.yml calls it so a broken build can
# never become a release. Keep it self-contained - a caller passes nothing and
# needs no secrets.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must share a MAJOR npm with whoever generates package-lock.json.
          # Node 20 ships npm 10, and npm 10 and 11 resolve the optional deps of
          # @tailwindcss/oxide-wasm32-wasi differently: a lock written by npm 11
          # omits @emnapi/core and @emnapi/runtime, and npm 10 then fails `npm ci`
          # with "Missing: @emnapi/core from lock file" while the same lock
          # installs cleanly under npm 11. Node 24 ships npm 11.
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      # fixtures.json is git-ignored real session data, so CI never has one. The
      # `pretypecheck` and `prebuild` hooks seed the empty template first, which
      # is why a fresh clone does not fail on the app's static import of it.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Hosting is public. Prove the artifact carries no local session data.
      # This is a security control, not a lint step - see scripts/verify-bundle.mjs.
      - name: Verify bundle carries no local data
        run: npm run verify
