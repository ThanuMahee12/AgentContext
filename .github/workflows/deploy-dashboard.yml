name: Deploy dashboard to Firebase Hosting

# The dashboard reads Firestore live, so its data is current without a redeploy.
# Deploys therefore follow CODE changes, not a clock. The nightly run is a
# backstop that catches drift (a dependency change, a failed earlier run), not
# the mechanism by which data reaches the site.
#
# The push trigger is gone on purpose: release.yml now owns the main branch and
# calls this workflow after it has tagged a release, so every deploy corresponds
# to a version someone can name. Two workflows both watching `push: main` would
# have raced for the same Hosting site.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit, tag or branch to build and deploy. Defaults to the triggering ref.'
        type: string
        required: false
        default: ''
  schedule:
    # 18:30 UTC = 00:00 Asia/Colombo. GitHub cron is UTC only.
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit, tag or branch to build and deploy (blank = default branch)'
        type: string
        required: false
        default: ''

# Never let two deploys race to the same Hosting site. This group is shared with
# the scheduled backstop, so a nightly run queues behind a release rather than
# overwriting it.
concurrency:
  group: firebase-hosting
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty string means "whatever triggered this", which is what the
          # schedule and a bare dispatch want. A release passes its own tag.
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Re-checked here rather than trusted from CI: this job builds its own
      # artifact from its own checkout, and the artifact that gets uploaded is
      # the one that has to be clean.
      - name: Verify bundle carries no local data
        run: npm run verify

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: agentcontext-sessions
          channelId: live
