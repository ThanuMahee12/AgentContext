name: Deploy dashboard to Firebase Hosting

# The dashboard reads Firestore live, so its data is current without a redeploy.
# Deploys therefore follow CODE changes, not a clock. The nightly run is a
# backstop that catches drift (a dependency change, a failed earlier run), not
# the mechanism by which data reaches the site.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-dashboard.yml'
  schedule:
    # 18:30 UTC = 00:00 Asia/Colombo. GitHub cron is UTC only.
    - cron: '30 18 * * *'
  workflow_dispatch:

# Never let two deploys race to the same Hosting site.
concurrency:
  group: firebase-hosting
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Build
        working-directory: web
        run: npm run build

      # Hosting is public. Prove the artifact carries no local session data
      # before anything is uploaded.
      - name: Verify bundle carries no local data
        working-directory: web
        run: node scripts/verify-bundle.mjs

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: agentcontext-sessions
          channelId: live
