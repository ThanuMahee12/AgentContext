<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Agentix">
  <!-- A session spawning subagents: the one relationship the data model is
       built around, and the same motif the sign-in backdrop animates.
       Tethers first, nodes over them - the circles are opaque, so the lines
       need no trimming. -->
  <g stroke="#6f93d6" stroke-width="2.6" stroke-linecap="round" opacity="0.55">
    <line x1="10.5" y1="16" x2="23.5" y2="7.5" />
    <line x1="10.5" y1="16" x2="23.5" y2="24.5" />
  </g>
  <g fill="#6f93d6">
    <circle cx="10.5" cy="16" r="5.6" />
    <circle cx="23.5" cy="7.5" r="3.6" />
    <circle cx="23.5" cy="24.5" r="3.6" />
  </g>
</svg>
